<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="MacBook screen showing a terminal introducing Prince Ampofo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1464"/>
      <stop offset="0.5" stop-color="#5b2a86"/>
      <stop offset="1" stop-color="#0f6fa8"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1d1d6"/>
      <stop offset="1" stop-color="#8e8e93"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <style>
    text { font-family: 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 14px; }
    .ui { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; fill: #fff; }
    .l { opacity: 0; animation: show .01s forwards; }
    @keyframes show { to { opacity: 1; } }
    .p { fill: #7ee787; font-weight: 700; }
    .c { fill: #f0f6fc; }
    .k { fill: #79c0ff; }
    .v { fill: #c9d1d9; }
    .a { fill: #d2a8ff; }
    .cur { fill: #58a6ff; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- lid -->
  <g filter="url(#shadow)">
    <rect x="80" y="10" width="800" height="500" rx="26" fill="#1c1c1e" stroke="#48484a" stroke-width="2"/>
  </g>
  <!-- screen -->
  <rect x="96" y="26" width="768" height="468" rx="12" fill="url(#wall)"/>
  <rect x="96" y="26" width="768" height="468" rx="12" fill="url(#glow)"/>

  <!-- menu bar + notch -->
  <path d="M96 38a12 12 0 0 1 12-12h744a12 12 0 0 1 12 12v10H96z" fill="#000" fill-opacity="0.35"/>
  <path d="M424 26h112v8a10 10 0 0 1-10 10h-92a10 10 0 0 1-10-10z" fill="#1c1c1e"/>
  <circle cx="480" cy="33" r="3" fill="#0a0a0c" stroke="#2c2c2e"/>
  <text class="ui" x="116" y="41" font-weight="700">Terminal</text>
  <text class="ui" x="178" y="41" fill-opacity="0.85">Shell</text>
  <text class="ui" x="218" y="41" fill-opacity="0.85">Edit</text>
  <text class="ui" x="254" y="41" fill-opacity="0.85">View</text>
  <text class="ui" x="838" y="41" text-anchor="end" fill-opacity="0.9"></text>

  <!-- terminal window -->
  <g filter="url(#shadow)">
    <rect x="140" y="64" width="680" height="400" rx="12" fill="#0d1117" fill-opacity="0.97" stroke="#30363d"/>
  </g>
  <path d="M140 76a12 12 0 0 1 12-12h656a12 12 0 0 1 12 12v22H140z" fill="#161b22"/>
  <line x1="140" y1="98" x2="820" y2="98" stroke="#30363d"/>
  <circle cx="162" cy="81" r="6" fill="#ff5f57"/>
  <circle cx="182" cy="81" r="6" fill="#febc2e"/>
  <circle cx="202" cy="81" r="6" fill="#28c840"/>
  <text x="480" y="86" text-anchor="middle" fill="#8b949e" style="font-size:12px">prince — zsh — 80×24</text>

  <text class="l" style="animation-delay:0.60s" x="164" y="132"><tspan class="p">❯</tspan> <tspan class="c">whoami</tspan></text>
  <text class="l" style="animation-delay:0.90s" x="164" y="154" fill="#f0f6fc" font-weight="700">prince ampofo</text>
  <text class="l" style="animation-delay:1.50s" x="164" y="198"><tspan class="p">❯</tspan> <tspan class="c">cat about.txt</tspan></text>
  <text class="l" style="animation-delay:1.80s" x="164" y="220"><tspan class="k">role</tspan><tspan x="272" class="v">Software Engineer  ·  Researcher  ·  Builder</tspan></text>
  <text class="l" style="animation-delay:2.10s" x="164" y="242"><tspan class="k">shipped at</tspan><tspan x="272" class="v">Uber  ·  LinkedIn</tspan></text>
  <text class="l" style="animation-delay:2.40s" x="164" y="264"><tspan class="k">focus</tspan><tspan x="272" class="v">Software Engineering × AI × Machine Learning</tspan></text>
  <text class="l" style="animation-delay:3.00s" x="164" y="308"><tspan class="p">❯</tspan> <tspan class="c">./now.sh</tspan></text>
  <text class="l" style="animation-delay:3.30s" x="164" y="330"><tspan class="a">→</tspan> <tspan class="v">exploring LLM, MCP and AI agents</tspan></text>
  <text class="l" style="animation-delay:3.60s" x="164" y="352"><tspan class="a">→</tspan> <tspan class="v">building backend systems that scale</tspan></text>
  <text class="l" style="animation-delay:3.90s" x="164" y="374"><tspan class="a">→</tspan> <tspan class="v">debugging things that vanish when logging is added</tspan></text>
  <text class="l" style="animation-delay:4.50s" x="164" y="418"><tspan class="p">❯</tspan> <tspan class="cur">█</tspan></text>

  <!-- base -->
  <rect x="30" y="508" width="900" height="16" rx="8" fill="url(#base)"/>
  <rect x="410" y="508" width="140" height="7" rx="3.5" fill="#636366"/>
</svg>